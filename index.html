<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Dashboard</title>
 
<style>
body{
  margin:0;
  font-family:"Segoe UI",sans-serif;
  background:#0f172a;
  color:#e5e7eb;
  display:flex;
  justify-content:center;
}
.app{
  width:100%;
  max-width:1000px;
  padding:20px;
}
.header{text-align:center}
.nav{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
  margin:15px 0;
}
.nav button{
  background:#1f2937;
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  cursor:pointer;
}
.active{background:#4f46e5}
.card{
  background:rgba(255,255,255,.05);
  padding:16px;
  border-radius:12px;
  margin-top:15px;
}
.view{display:none}
.show{display:block}
input,button{
  padding:8px;
  margin:4px 0;
  border-radius:6px;
  border:1px solid #334155;
  background:#020617;
  color:white;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  border-bottom:1px solid #334155;
  padding:8px;
  text-align:center;
}
#toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#4f46e5;
  padding:10px 14px;
  border-radius:8px;
  opacity:0;
  transition:.3s;
}
 
input[type="date"] {
  color-scheme: dark;
}
 
input[type="month"] {
  color-scheme: dark;
  color: white;
}
 
input[type="month"]::-webkit-calendar-picker-indicator
input[type="month"]::-webkit-calendar-picker-indicator {
  filter: invert(1);
}
 
#toast.show{opacity:1}
</style>
</head>
 
<body>
<div class="app">
 
<div class="header">
  <h2>💰 Expense Dashboard</h2>
  <div id="activeUserInfo"></div>
</div>
 
<div class="nav">
  <button id="b1" class="active" onclick="showView('add')">➕ Add Expense</button>
  <button id="b2" onclick="showView('expenses')">📋 Expenses</button>
  <button id="b3" onclick="showView('summary')">📊 Summary</button>
  <button id="b4" onclick="showView('users')">👤 Users</button>
  <button id="b5" onclick="showView('categories')">📁 Categories</button>
</div>
 
<!-- ADD EXPENSE -->
<div class="card view show" id="addView">
  <h3>Add / Edit Expense</h3>
  <input id="expenseName" placeholder="Expense name">
  <input id="category" list="cats" placeholder="Category">
  <datalist id="cats"></datalist>
  <input id="amount" type="number" placeholder="Amount">
  <input id="date" type="date">
  <button onclick="addExpense()">Save Expense</button>
</div>
 
<!-- EXPENSE LIST -->
<div class="card view" id="expenseView">
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Category</th><th>₹</th><th>Date</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="list"></tbody>
  </table>
</div>
 
<!-- SUMMARY -->
<div class="card view" id="summaryView">
  <h3>Monthly Summary</h3>
  <input type="month" id="monthPicker" onchange="summary()">
  <div id="summaryText"></div>
</div>
 
<!-- USERS -->
<div class="card view" id="userView">
  <h3>User Management</h3>
  <input id="userName" placeholder="User Name">
  <input id="userEmail" placeholder="Email">
  <button onclick="saveUser()">Save User</button>
  <table>
    <thead>
      <tr>
        <th>Name</th><th>Email</th><th>Active</th><th>Action</th>
      </tr>
    </thead>
    <tbody id="userList"></tbody>
  </table>
</div>
 
<!-- CATEGORIES -->
<div class="card view" id="categoryView">
  <h3>Category Management</h3>
  <input id="categoryName" placeholder="Category Name">
  <button onclick="saveCategory()">Save Category</button>
  <table>
    <thead><tr><th>Category</th><th>Action</th></tr></thead>
    <tbody id="categoryList"></tbody>
  </table>
</div>
 
</div>
 
<div id="toast"></div>
 
<script>
/* ---------- GLOBAL STATE ---------- */
let users = JSON.parse(localStorage.getItem("users")) || [];
let categories = JSON.parse(localStorage.getItem("categories")) || [];
let expenses = JSON.parse(localStorage.getItem("expenses")) || [];
let activeUserId = localStorage.getItem("activeUserId");
let userEdit = -1, catEdit = -1, expEdit = -1;
 
/* ---------- UTILS ---------- */
const nameEl=()=>name;
const catEl=()=>category;
const amtEl=()=>amount;
const dateEl=()=>date;
 
function renderActiveUser(){
  const u = users.find(u => u.id == activeUserId);
  activeUserInfo.innerText = u
    ? "Active User: " + u.name
    : "No user selected";
}
 
 
function showToast(msg){
  toast.innerText=msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),2000);
}
 
function showView(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.remove("show"));
  document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
  ({add:addView,expenses:expenseView,summary:summaryView,users:userView,categories:categoryView}[v]).classList.add("show");
  document.getElementById("b"+({add:1,expenses:2,summary:3,users:4,categories:5}[v])).classList.add("active");
  renderAll();
}
 
/* ---------- USER CRUD ---------- */
function saveUser(){
  const name=userName.value.trim(), email=userEmail.value.trim();
  if(!name||!email) return showToast("Invalid user");
  if(userEdit==-1) users.push({id:Date.now(),name,email});
  else users[userEdit]={...users[userEdit],name,email};
  userEdit=-1;
  localStorage.setItem("users",JSON.stringify(users));
  renderUsers(); showToast("User saved");
  userName.value=userEmail.value="";
}
 
function renderUsers(){
  userList.innerHTML=users.map((u,i)=>`
    <tr>
      <td>${u.name}</td><td>${u.email}</td>
      <td>${u.id==activeUserId?"✅":""}</td>
      <td>
        <button onclick="setUser(${u.id})">Use</button>
        <button onclick="editUser(${i})">✏️</button>
        <button onclick="delUser(${i})">🗑</button>
      </td>
    </tr>`).join("");
}
 
function setUser(id){
  activeUserId=id;
  localStorage.setItem("activeUserId",id);
  renderAll(); showToast("Active user set");
}
function editUser(i){userEdit=i; userName.value=users[i].name; userEmail.value=users[i].email;}
function delUser(i){
  const id=users[i].id;
  users.splice(i,1);
  expenses=expenses.filter(e=>e.userId!=id);
  localStorage.setItem("users",JSON.stringify(users));
  localStorage.setItem("expenses",JSON.stringify(expenses));
  renderAll();
}
 
/* ---------- CATEGORY CRUD ---------- */
function saveCategory(){
  const c=categoryName.value.trim();
  if(!c) return;
  if(catEdit==-1) categories.push(c);
  else categories[catEdit]=c;
  catEdit=-1;
  localStorage.setItem("categories",JSON.stringify(categories));
  categoryName.value="";
  renderCategories(); renderCategoryOptions();
}
 
function renderCategories(){
  categoryList.innerHTML=categories.map((c,i)=>`
    <tr><td>${c}</td>
    <td>
      <button onclick="editCat(${i})">✏️</button>
      <button onclick="delCat(${i})">🗑</button>
    </td></tr>`).join("");
}
function editCat(i){catEdit=i; categoryName.value=categories[i]}
function delCat(i){
  if(expenses.some(e=>e.category==categories[i])) return alert("Category in use");
  categories.splice(i,1);
  localStorage.setItem("categories",JSON.stringify(categories));
  renderCategories(); renderCategoryOptions();
}
function renderCategoryOptions(){
  cats.innerHTML=categories.map(c=>`<option value="${c}">`).join("");
}
 
/* ---------- EXPENSE CRUD ---------- */
function addExpense(){
  if(!activeUserId) return showToast("Select user first");
  if(!expenseName.value.trim()) return showToast("Enter expense name");
  if(!category.value.trim()) return showToast("Select category");
  if(!amount.value || amount.value <= 0) return showToast("Enter valid amount");
  if(!date.value) return showToast("Select date");
 
  const d = {
    id: Date.now(),
    userId: +activeUserId,
    name: expenseName.value.trim(),
    category: category.value,
    amount: +amount.value,
    date: date.value
  };
 
  if(expEdit === -1) {
    expenses.push(d);
  } else {
    expenses[expEdit] = { ...d, id: expenses[expEdit].id };
    expEdit = -1;
  }
 
  localStorage.setItem("expenses", JSON.stringify(expenses));
  clearExp();
  renderExpenses();
}
 
function renderExpenses(){
  list.innerHTML=expenses.filter(e=>e.userId==activeUserId).map(e=>`
    <tr>
      <td>${e.name}</td><td>${e.category}</td><td>₹${e.amount}</td><td>${e.date}</td>
      <td>
        <button onclick="editExpense(${e.id})">✏️</button>
        <button onclick="delExpense(${e.id})">🗑</button>
      </td>
    </tr>`).join("");
}
function editExpense(id){
  const i=expenses.findIndex(e=>e.id==id);
  const e=expenses[i]; expEdit=i;
  expenseName.value=e.name; category.value=e.category; amount.value=e.amount; date.value=e.date;
  showView('add');
}
function delExpense(id){
  if(!confirm("Are you sure you want to delete this expense?")) return;
 
  expenses = expenses.filter(e => e.id != id);
  localStorage.setItem("expenses", JSON.stringify(expenses));
  renderExpenses();
  summary();
}
function clearExp(){expenseName.value=category.value=amount.value="";date.value=new Date().toISOString().slice(0,10)}
 
/* ---------- SUMMARY ---------- */
function summary(){
  if(!activeUserId||!monthPicker.value) return;
  const [y,m]=monthPicker.value.split("-");
  let t=0,map={};
  expenses.filter(e=>e.userId==activeUserId).forEach(e=>{
    const d=new Date(e.date);
    if(d.getFullYear()==y&&d.getMonth()+1==m){
      t+=e.amount;
      map[e.category]=(map[e.category]||0)+e.amount;
    }
  });
  summaryText.innerHTML=t?`<b>Total ₹${t}</b><hr>`+Object.entries(map).map(x=>`${x[0]}:₹${x[1]}`).join("<br>"):"No data";
}
 
/* ---------- INIT ---------- */
date.value=new Date().toISOString().slice(0,10);
const today = new Date().toISOString().slice(0,10);
date.max = today;
monthPicker.value=new Date().toISOString().slice(0,7);
renderAll();
function renderAll(){
  renderUsers();
  renderCategories();
  renderCategoryOptions();
  renderExpenses();
  summary();
  renderActiveUser();
}
</script>
</body>
</html>
